# Sviluppo locale: http://localhost:88 (MariaDB esposto sulla porta 3307)
#
# Schema di unlimiteddb (app php-fpm + nginx + db + worker), con queste differenze:
#   - porta web 88 (66 è di unlimiteddb) e porta MariaDB 3307 (3306 è di unlimiteddb): i due progetti
#     possono girare insieme;
#   - rete interna senza subnet né IP fissi: l'utente del database è autorizzato da '%'
#     (docker/mysql/init.dev.sql), il database non è raggiungibile da fuori la rete interna;
#   - le foto stanno fuori da git, in ./storage/app/public/<autore>/<AAAA MM GG - descrizione>/ (bind mount
#     di ./storage): nginx le legge in sola lettura, app e worker scrivono solo in _derived (versioni);
#   - un solo worker, una foto alla volta, con gli stessi parametri della produzione
#     (docker/supervisor/worker.conf), ma lanciato direttamente senza supervisord.
#
# Comandi:
#   docker compose -f docker-compose.dev.yml up -d --build
#   docker compose -f docker-compose.dev.yml exec app php artisan migrate
#   docker compose -f docker-compose.dev.yml exec app php artisan media:sync
#   docker compose -f docker-compose.dev.yml down        (aggiungi -v per cancellare anche il database)
services:
  app:
    build: .
    image: foto:dev
    container_name: foto_app_dev
    restart: unless-stopped
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
      - ./resources/views:/var/www/html/resources/views:ro
      # l'entrypoint rinfresca qui gli asset compilati nell'immagine; nginx li serve da ./public
      - ./public/build:/var/www/html/public/build
    environment:
      - APP_URL=http://localhost:88
      - DB_HOST=db
      - DB_DATABASE=foto
      - DB_USERNAME=foto
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: foto_nginx_dev
    restart: unless-stopped
    ports:
      - "88:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      # originali e versioni generate (_derived): nginx li legge soltanto
      - ./storage/app/public:/var/www/html/storage/app/public:ro
    networks:
      - internal
    depends_on:
      - app

  db:
    image: mariadb:11
    container_name: foto_db_dev
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=foto
    volumes:
      - db_data_dev:/var/lib/mysql
      - ./docker/mysql/init.dev.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Un solo worker: genera le versioni delle foto (web e miniatura) una alla volta.
  worker:
    image: foto:dev
    container_name: foto_worker_dev
    restart: unless-stopped
    command: php artisan queue:work --memory=200 --timeout=150 --tries=3 --max-time=3600
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
    environment:
      - APP_URL=http://localhost:88
      - DB_HOST=db
      - DB_DATABASE=foto
      - DB_USERNAME=foto
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

networks:
  internal:
    driver: bridge

volumes:
  db_data_dev:
