# Produzione / prova sulla VM Oracle (host foto.mandich.dev), schema di unlimiteddb.
# Database: MariaDB dedicato (servizio "db"). Branch di deploy: laravel (immagine ghcr.io/rickymandich/foto:laravel).
services:
  app:
    build: .
    image: ghcr.io/rickymandich/foto:laravel
    container_name: foto_app
    restart: unless-stopped
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
      - build_assets:/var/www/html/public/build
    environment:
      - DB_HOST=db
      - DB_DATABASE=foto
      - DB_USERNAME=laravel
      - DB_PASSWORD=
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: foto_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - build_assets:/var/www/html/public/build:ro
      # originali e versioni: nginx li legge soltanto
      - ./storage/app/public:/var/www/html/storage/app/public:ro
    networks:
      - internal
      - proxy
    depends_on:
      - app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.foto.rule=Host(`foto.mandich.dev`)"
      - "traefik.http.routers.foto.entrypoints=websecure"
      - "traefik.http.routers.foto.tls.certresolver=letsencrypt"
      - "traefik.http.services.foto.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"

  db:
    image: mariadb:11
    container_name: foto_db
    restart: unless-stopped
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=foto
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Un solo worker (supervisord): genera le versioni delle foto una alla volta.
  worker:
    image: ghcr.io/rickymandich/foto:laravel
    container_name: foto_worker
    restart: unless-stopped
    command: supervisord -c /etc/supervisor/worker.conf
    stop_grace_period: 170s
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
      - ./docker/supervisor/worker.conf:/etc/supervisor/worker.conf:ro
    environment:
      - DB_HOST=db
      - DB_DATABASE=foto
      - DB_USERNAME=laravel
      - DB_PASSWORD=
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

networks:
  internal:
    driver: bridge
  proxy:
    external: true

volumes:
  db_data:
  build_assets:
