<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Photo System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light min-vh-100">

  <nav class="navbar bg-secondary mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">
        <i class="fa-solid fa-camera-retro me-2"></i>Gallery Photo System
      </span>
      <span class="text-info small">
        <i class="fa-solid fa-folder-open me-1"></i><span id="galleryCount">0</span> gallerie
      </span>
    </div>
  </nav>

  <main class="container pb-5">
    <div id="loading" class="text-center py-5">
      <div class="spinner-border" role="status"></div>
      <p class="mt-3 text-info">Caricamento gallerie...</p>
    </div>
    <div id="error" class="alert alert-danger d-none" role="alert"></div>
    <div id="galleries" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const enc = encodeURIComponent;

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function formatTitle(name) {
      const m = name.match(/^(\d{4})[\s_-]+(\d{2})[\s_-]+(\d{2})\s*-\s*(.+)$/);
      if (!m) return { date: '', rest: name };
      return { date: `${m[3]}/${m[2]}/${m[1]}`, rest: m[4] };
    }

    async function fetchLines(url) {
      try {
        const r = await fetch(url, { cache: 'no-cache' });
        if (!r.ok) return [];
        const t = await r.text();
        return t.split('\n').map(s => s.trim()).filter(Boolean);
      } catch { return []; }
    }

    async function loadGallery(name) {
      const [photos, songs] = await Promise.all([
        fetchLines(enc(name) + '/photo.txt'),
        fetchLines(enc(name) + '/song.txt')
      ]);
      return { name, photos, songs };
    }

    function renderCard(g) {
      const { date, rest } = formatTitle(g.name);
      const safeRest = escapeHtml(rest);
      const url = `gallery.html?g=${enc(g.name)}`;
      const cover = g.photos.length
        ? `${enc(g.name)}/${enc(g.photos[0])}`
        : '';
      const audioBadge = g.songs.length
        ? `<span class="badge bg-info text-dark ms-1"><i class="fa-solid fa-music me-1"></i>${g.songs.length}</span>`
        : '';
      const coverHtml = cover
        ? `<div class="ratio ratio-16x9">
             <img src="${cover}" class="card-img-top object-fit-cover" alt="" loading="lazy">
           </div>`
        : `<div class="ratio ratio-16x9 bg-dark d-flex align-items-center justify-content-center">
             <i class="fa-solid fa-image text-secondary fa-3x"></i>
           </div>`;
      return `
        <div class="col">
          <div class="card bg-secondary h-100 border-0 shadow position-relative">
            ${coverHtml}
            <div class="card-body">
              <h5 class="card-title mb-1 text-capitalize">${safeRest}</h5>
              <p class="card-text small text-info mb-2">
                <i class="fa-regular fa-calendar me-1"></i>${date}
              </p>
              <span class="badge bg-dark"><i class="fa-solid fa-images me-1"></i>${g.photos.length} foto</span>
              ${audioBadge}
            </div>
            <a href="${url}" class="stretched-link" aria-label="Apri ${safeRest}"></a>
          </div>
        </div>`;
    }

    (async () => {
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      const containerEl = document.getElementById('galleries');
      const countEl = document.getElementById('galleryCount');

      const galleryNames = await fetchLines('gallery.txt');
      if (!galleryNames.length) {
        loadingEl.classList.add('d-none');
        errorEl.innerHTML = 'Nessuna galleria trovata. Esegui <code>bash/scan.sh</code> per generarle.';
        errorEl.classList.remove('d-none');
        return;
      }

      const galleries = await Promise.all(galleryNames.map(loadGallery));
      const valid = galleries.filter(g => g.photos.length > 0);

      loadingEl.classList.add('d-none');
      countEl.textContent = valid.length;

      if (!valid.length) {
        errorEl.textContent = 'Nessuna galleria contiene foto.';
        errorEl.classList.remove('d-none');
        return;
      }

      containerEl.innerHTML = valid.map(renderCard).join('');
    })();
  </script>
</body>
</html>
